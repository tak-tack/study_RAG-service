# 로컬 개발용 PostgreSQL + pgvector 구성입니다.
# 운영에서는 사용하지 않으며, 애플리케이션은 ``.env``의 DATABASE_URL을 통해
# 외부 ``chatbot`` 스키마 DB 또는 이 로컬 컨테이너에 연결합니다.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
