# Python 패키지·의존성 정의입니다. FastAPI 진입점은 ``app.main``이며, NiFi 수신 라우터와
# 적재 서비스가 아래 런타임 라이브러리를 사용합니다.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "study-rag-service"
version = "0.1.0"
description = "A local-first document ingestion foundation for RAG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langchain>=1.0,<2",
    "langchain-ollama>=0.3,<2",
    "langchain-text-splitters>=0.3,<2",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
